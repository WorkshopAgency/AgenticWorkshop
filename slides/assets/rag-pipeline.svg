<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 430" width="1160" height="430" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5d5a55"/>
    </marker>
  </defs>
  <rect width="1160" height="430" fill="#ffffff"/>
  <text x="20" y="40" font-size="20" font-weight="700" fill="#8a8580">ONCE</text>
  <text x="20" y="240" font-size="20" font-weight="700" fill="#8a8580">EVERY QUESTION</text>

  <!-- once row -->
  <g font-size="22" text-anchor="middle">
    <rect x="20" y="60" width="200" height="90" rx="12" fill="#f4f1ea" stroke="#8a8580" stroke-width="2"/>
    <text x="120" y="100" font-weight="700" fill="#1b1b1b">Documents</text>
    <text x="120" y="128" font-size="18" fill="#5d5a55">55,000 tokens</text>

    <rect x="300" y="60" width="200" height="90" rx="12" fill="#ffffff" stroke="#246b60" stroke-width="3"/>
    <text x="400" y="100" font-weight="700" fill="#246b60">Chunk</text>
    <text x="400" y="128" font-size="18" fill="#5d5a55">~380 pieces</text>

    <rect x="580" y="60" width="200" height="90" rx="12" fill="#ffffff" stroke="#246b60" stroke-width="3"/>
    <text x="680" y="100" font-weight="700" fill="#246b60">Embed</text>
    <text x="680" y="128" font-size="18" fill="#5d5a55">text → vector</text>

    <rect x="860" y="60" width="200" height="90" rx="12" fill="#f4f1ea" stroke="#8a8580" stroke-width="2"/>
    <text x="960" y="100" font-weight="700" fill="#1b1b1b">Index</text>
    <text x="960" y="128" font-size="18" fill="#5d5a55">one vector per piece</text>
  </g>
  <g stroke="#5d5a55" stroke-width="3" fill="none" marker-end="url(#a)">
    <path d="M220,105 L298,105"/><path d="M500,105 L578,105"/><path d="M780,105 L858,105"/>
  </g>

  <!-- question row -->
  <g font-size="22" text-anchor="middle">
    <rect x="20" y="260" width="170" height="90" rx="12" fill="#f4f1ea" stroke="#8a8580" stroke-width="2"/>
    <text x="105" y="312" font-weight="700" fill="#1b1b1b">Question</text>

    <rect x="250" y="260" width="200" height="90" rx="12" fill="#ffffff" stroke="#246b60" stroke-width="3"/>
    <text x="350" y="300" font-weight="700" fill="#246b60">Retrieve</text>
    <text x="350" y="328" font-size="18" fill="#5d5a55">the k closest pieces</text>

    <rect x="510" y="260" width="200" height="90" rx="12" fill="#ffffff" stroke="#246b60" stroke-width="3"/>
    <text x="610" y="300" font-weight="700" fill="#246b60">Prompt</text>
    <text x="610" y="328" font-size="18" fill="#5d5a55">question + pieces</text>

    <rect x="770" y="260" width="170" height="90" rx="12" fill="#ffffff" stroke="#990000" stroke-width="3"/>
    <text x="855" y="300" font-weight="700" fill="#990000">Model</text>
    <text x="855" y="328" font-size="18" fill="#5d5a55">answers, cites [c12]</text>

    <rect x="990" y="260" width="150" height="90" rx="12" fill="#f4f1ea" stroke="#8a8580" stroke-width="2"/>
    <text x="1065" y="300" font-weight="700" fill="#1b1b1b">You</text>
    <text x="1065" y="328" font-size="18" fill="#5d5a55">check [c12]</text>
  </g>
  <g stroke="#5d5a55" stroke-width="3" fill="none" marker-end="url(#a)">
    <path d="M190,305 L248,305"/><path d="M450,305 L508,305"/><path d="M710,305 L768,305"/><path d="M940,305 L988,305"/>
    <path d="M960,150 C960,205 350,200 350,258"/>
  </g>
  <text x="560" y="390" font-size="18" text-anchor="middle" fill="#8a8580">The model only sees the pieces you retrieved: about 800 tokens instead of 55,000.</text>
</svg>
